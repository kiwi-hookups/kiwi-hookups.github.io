<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">What each action costs on WannaHookup</title>
<desc id="d">Reading messages is free. A wink costs $1.60 on the starter pack and $1.14 on the biggest pack. A message costs $3.20 on the starter pack and $2.29 on the biggest pack.</desc>
